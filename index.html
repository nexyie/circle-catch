<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Circle Cath</title>
<style>
  :root {
    --bg: #f4f4f0;
    --fg: #222;
    --line: #999;
    --gate: #2a7d2a;
    --ball: #333;
    --miss: #b03030;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1c;
      --fg: #e8e8e8;
      --line: #666;
      --gate: #5fbf5f;
      --ball: #eee;
      --miss: #e07070;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1c;
    --fg: #e8e8e8;
    --line: #666;
    --gate: #5fbf5f;
    --ball: #eee;
    --miss: #e07070;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0;
    padding: 24px 12px;
  }

  h1 {
    font-size: 20px;
    font-weight: normal;
    letter-spacing: 1px;
    margin: 0 0 4px 0;
  }

  p.sub {
    margin: 0 0 16px 0;
    font-size: 13px;
    color: var(--line);
  }

  #wrap {
    max-width: 100%;
  }

  canvas {
    background: var(--bg);
    border: 1px solid var(--line);
    max-width: 100%;
    touch-action: manipulation;
  }

  #stats {
    display: flex;
    gap: 24px;
    margin-top: 10px;
    font-size: 14px;
  }

  #msg {
    margin-top: 8px;
    font-size: 13px;
    min-height: 18px;
    color: var(--line);
  }

  button {
    margin-top: 4px;
    font-family: inherit;
    font-size: 13px;
    background: none;
    border: 1px solid var(--line);
    color: var(--fg);
    padding: 4px 10px;
    cursor: pointer;
  }

  button:hover {
    background: var(--fg);
    color: var(--bg);
  }
</style>
</head>
<body>

<h1>CIRCLE CATCH</h1>
<p class="sub">a dot circles the ring — tap (or press space) the instant it crosses the gate</p>

<div id="wrap">
  <canvas id="c" width="360" height="360"></canvas>
</div>

<div id="stats">
  <div>score: <span id="score">0</span></div>
  <div>best: <span id="best">0</span></div>
  <div>speed: <span id="speed">1.0</span>x</div>
</div>

<div id="msg">click the ring or press space to start</div>
<button id="resetBtn">reset best</button>

<script>
(function () {
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var speedEl = document.getElementById('speed');
  var msgEl = document.getElementById('msg');
  var resetBtn = document.getElementById('resetBtn');

  var W = canvas.width, H = canvas.height;
  var cx = W / 2, cy = H / 2, radius = 130;

  var angle = 0;
  var baseSpeed = 0.018; // radians per frame
  var speedMult = 1.0;
  var gateAngle = Math.random() * Math.PI * 2;
  var gateWidth = 0.35; // radians, shrinks slightly as speed rises
  var score = 0;
  var best = 0;
  var running = false;
  var flashUntil = 0;
  var flashColor = null;

  try {
    var stored = localStorage.getItem('orbitCatchBest');
    if (stored) best = parseInt(stored, 10) || 0;
  } catch (e) {}
  bestEl.textContent = best;

  function normalize(a) {
    a = a % (Math.PI * 2);
    if (a < 0) a += Math.PI * 2;
    return a;
  }

  function angularDist(a, b) {
    var d = Math.abs(normalize(a) - normalize(b));
    return Math.min(d, Math.PI * 2 - d);
  }

  function newGate() {
    gateAngle = Math.random() * Math.PI * 2;
    gateWidth = Math.max(0.14, 0.35 - speedMult * 0.03);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    var css = getComputedStyle(document.documentElement);
    var lineColor = css.getPropertyValue('--line').trim();
    var gateColor = css.getPropertyValue('--gate').trim();
    var ballColor = css.getPropertyValue('--ball').trim();
    var missColor = css.getPropertyValue('--miss').trim();

    // ring
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.strokeStyle = lineColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // gate arc
    ctx.beginPath();
    ctx.arc(cx, cy, radius, gateAngle - gateWidth / 2, gateAngle + gateWidth / 2);
    ctx.strokeStyle = (Date.now() < flashUntil && flashColor === 'miss') ? missColor : gateColor;
    ctx.lineWidth = 8;
    ctx.stroke();

    // center dot
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI * 2);
    ctx.fillStyle = lineColor;
    ctx.fill();

    // ball
    var bx = cx + Math.cos(angle) * radius;
    var by = cy + Math.sin(angle) * radius;
    ctx.beginPath();
    ctx.arc(bx, by, 8, 0, Math.PI * 2);
    var flashing = Date.now() < flashUntil;
    ctx.fillStyle = flashing ? (flashColor === 'hit' ? gateColor : missColor) : ballColor;
    ctx.fill();
  }

  function tick() {
    if (running) {
      angle += baseSpeed * speedMult;
      angle = normalize(angle);
    }
    draw();
    requestAnimationFrame(tick);
  }

  function attempt() {
    if (!running) {
      start();
      return;
    }
    var d = angularDist(angle, gateAngle);
    if (d <= gateWidth / 2) {
      score++;
      speedMult = 1 + score * 0.08;
      scoreEl.textContent = score;
      speedEl.textContent = speedMult.toFixed(1);
      flashColor = 'hit';
      flashUntil = Date.now() + 120;
      msgEl.textContent = 'caught it';
      newGate();
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try { localStorage.setItem('orbitCatchBest', String(best)); } catch (e) {}
      }
    } else {
      flashColor = 'miss';
      flashUntil = Date.now() + 200;
      msgEl.textContent = 'missed — score reset';
      running = false;
      setTimeout(function () {
        msgEl.textContent = 'click the ring or press space to try again';
      }, 700);
      score = 0;
      speedMult = 1.0;
      scoreEl.textContent = score;
      speedEl.textContent = speedMult.toFixed(1);
    }
  }

  function start() {
    running = true;
    angle = 0;
    score = 0;
    speedMult = 1.0;
    scoreEl.textContent = score;
    speedEl.textContent = speedMult.toFixed(1);
    newGate();
    msgEl.textContent = 'go';
  }

  canvas.addEventListener('click', attempt);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      attempt();
    }
  });

  resetBtn.addEventListener('click', function () {
    best = 0;
    bestEl.textContent = 0;
    try { localStorage.removeItem('orbitCatchBest'); } catch (e) {}
    msgEl.textContent = 'best score cleared';
  });

  newGate();
  draw();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
